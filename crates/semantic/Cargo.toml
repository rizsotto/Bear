# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "semantic"
description = "Compiler recognition and command line flag parsing for Bear."
keywords = ["clang", "clang-tooling", "compilation-database"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "semantic"
path = "src/lib.rs"

[features]
# Compiles the `testing` module (command factories and comparison helpers)
# into the library, so dependents can build their own tests against it.
# Off by default, so release builds carry no test factories.
testing = []

[dependencies]
intercept = { path = "../intercept" }
thiserror.workspace = true
log.workspace = true
shell-words.workspace = true
regex-lite.workspace = true
libc.workspace = true

[build-dependencies]
compilers-codegen = { path = "../../build-support/compilers-codegen" }

[dev-dependencies]
tempfile.workspace = true
mockall.workspace = true
