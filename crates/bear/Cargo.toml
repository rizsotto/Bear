[package]
name = "bear"
description = "Bear is a tool that generates a compilation database for clang tooling."
keywords = ["clang", "clang-tooling", "compilation-database"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bear"
path = "src/lib.rs"

[dependencies]
intercept = { path = "../intercept" }
intercept-supervisor = { path = "../intercept-supervisor" }
semantic = { path = "../semantic" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
clap.workspace = true
log.workspace = true
shell-words.workspace = true
libc.workspace = true
glob.workspace = true

[dev-dependencies]
semantic = { path = "../semantic", features = ["testing"] }
mockall.workspace = true
tempfile.workspace = true
