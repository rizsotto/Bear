name: CodeQL

on:
  push:
    branches: [master, next]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
          # The preload shim is compiled by the cc crate, so CodeQL has
          # to trace a real build to see it.
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build-mode == 'manual'
        with:
          toolchain: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: cargo build -p intercept-preload
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
