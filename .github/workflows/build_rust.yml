name: rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep identical to the typos version the devcontainer installs.
  TYPOS_VERSION: 1.51.1

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings

  compile:
    name: Compile
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --verbose --release

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        toolchain:
          - stable
          - nightly
        include:
          - os: ubuntu-26.04-arm
            toolchain: stable
    runs-on: ${{ matrix.os }}
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install ccache on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
      - name: Run integration tests
        run: |
          cargo build --verbose
          cargo test --verbose
        env:
          RUST_LOG: debug

  test-musl:
    name: Test (Alpine, musl)
    runs-on: ubuntu-latest
    needs: [lint]
    container: alpine:latest
    steps:
      - name: Install build dependencies
        run: apk add --no-cache git build-base lld rust cargo ccache
      - uses: actions/checkout@v7
      - name: Run integration tests
        run: |
          cargo build --verbose
          cargo test --verbose
        env:
          RUST_LOG: debug

  compile-android:
    name: Compile (Android, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi24-clang
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cross-build with the Android NDK
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          target_lower=$(echo "${{ matrix.target }}" | tr '-' '_')
          target_upper=$(echo "$target_lower" | tr 'a-z' 'A-Z')
          export "CC_${target_lower}=$ndk_bin/${{ matrix.clang }}"
          export "AR_${target_lower}=$ndk_bin/llvm-ar"
          export "CARGO_TARGET_${target_upper}_LINKER=$ndk_bin/${{ matrix.clang }}"
          cargo build --verbose --release --target ${{ matrix.target }}

  doc:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo doc --no-deps

  spellcheck:
    name: Spell Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@${{ env.TYPOS_VERSION }}
      - run: typos

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run Cargo Deny
        run: cargo deny check advisories licenses
