name: rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# No job here writes to the repository or its metadata; reading the
# checkout is the only scope any of them needs.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt -- --check

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --verbose --release

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        toolchain:
          - stable
          - nightly
    runs-on: ${{ matrix.os }}
    needs: [compile]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install ccache on Ubuntu
        # Bear's wrapper-recursion integration test
        # (wrapper_mode_survives_masquerade_wrapper_in_path) needs a ccache
        # masquerade dir to exist. The ccache package creates
        # /usr/lib/ccache/* symlinks; the test injects that dir into its own
        # child PATH. We deliberately do NOT prepend the dir to the job
        # PATH, because ccache first on PATH would inflate event counts
        # for other tests that assert exact compiler-event counts.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
      - name: Run integration tests
        run: |
          cargo build --verbose
          cargo test --verbose
        env:
          RUST_LOG: debug

  doc:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo doc --no-deps

  spellcheck:
    name: Spell Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Codespell
        run: pip install codespell
      - name: Run Codespell
        run: codespell

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run Cargo Audit
        run: cargo audit --deny warnings
