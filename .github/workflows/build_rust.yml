name: rust CI

on:
  push:
    branches: [master, next]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep identical to the typos version the devcontainer installs.
  TYPOS_VERSION: 1.51.1
  # Keep identical to the cargo-deny version in .deny.toml.
  CARGO_DENY_VERSION: 0.20.2

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        toolchain:
          - stable
          - nightly
        include:
          - os: ubuntu-26.04-arm
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install ccache on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
      - run: cargo build --locked
      - run: cargo test --locked
        env:
          RUST_LOG: debug

  test-musl:
    name: Test (alpine-latest, apk rust)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install build dependencies
        run: apk add --no-cache git build-base lld rust cargo ccache
      - uses: actions/checkout@v7
      - name: Expose rust toolchain versions
        run: |
          cargo --version
          rustc --version
      - run: cargo build --verbose --locked
      - run: cargo test --verbose --locked
        env:
          RUST_LOG: debug

  compile:
    name: Compile (ubuntu-latest, stable, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --release --locked

  compile-android:
    name: Compile (Android, ${{ matrix.target }}, API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            api: 24
            clang: aarch64-linux-android24-clang
          # posix_spawn and posix_spawnp exist from API 28.
          - target: aarch64-linux-android
            api: 28
            clang: aarch64-linux-android28-clang
          - target: armv7-linux-androideabi
            api: 24
            clang: armv7a-linux-androideabi24-clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cross-build with the Android NDK
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          target_lower=$(echo "${{ matrix.target }}" | tr '-' '_')
          target_upper=$(echo "$target_lower" | tr 'a-z' 'A-Z')
          export "CC_${target_lower}=$ndk_bin/${{ matrix.clang }}"
          export "AR_${target_lower}=$ndk_bin/llvm-ar"
          export "CARGO_TARGET_${target_upper}_LINKER=$ndk_bin/${{ matrix.clang }}"
          cargo build --verbose --release --target ${{ matrix.target }} --locked

  doc:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo doc --no-deps --locked

  spell-check:
    name: Spell Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@${{ env.TYPOS_VERSION }}
      - run: typos

  dependency-policy-check:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Run Cargo Deny
        run: cargo deny check licenses bans sources
